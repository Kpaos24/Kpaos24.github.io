<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24 Game</title>
    <!-- Font links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="StyleSheet2.css">
    
    <style>
        @font-face {
            font-family: 'PressStart2P';
            src: url('https://fonts.cdnfonts.com/s/7397/PressStart2P-Regular.woff') format('woff');
        }

        body {
            font-family: 'DotGothic16', sans-serif;
            background-image: linear-gradient(25deg, black 0%, black 50%, orange 50%, orange 100%);

            background-size: cover;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .dark-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            opacity: 0;
            transition: opacity 2s ease-in-out;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            max-width: 400px;
            width: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            display: none;
            overflow-y: auto;
        }

        h1 {
            font-size: 24px;
            color: #ffcc00;
            margin-bottom: 20px;
            font-family: 'Mochiy Pop One', sans-serif;
        }

        #playButton {
            padding: 10px 20px;
           font-size: 1.5vw;
           background-color: darkorange;
          color: white;
           border: none;
           border-radius: 5px;
          cursor: pointer;
         transition: background-color 0.3s;
         z-index: 1000; /* Ensure button is above blocks */
        }

        #playButton:hover {
         background-color: black;
        }   


        #playButton:active {
            transform: scale(0.95);
        }

        input[type="number"] {
    width: 60px; /* Set a consistent width */
    height: 50px; /* Increased height for better usability */
    font-size: 1.2rem; /* Adjust font size for visibility */
    margin: 0 5px; /* Add spacing between inputs */
    border: 2px solid #ffcc00; /* Border styling */
    background-color: #222; /* Dark background for contrast */
    color: #fff; /* White text for readability */
    text-align: center; /* Center align text in input */
    border-radius: 8px; /* Rounded corners for input */
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4); /* Subtle shadow */
}

        button {
            background-color: #ffcc00;
            color: #000000;
            border: 2px solid #c7a200;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.1s ease;
            font-family: 'DotGothic16', sans-serif;
        }
        button:hover {
         background-color: darkorange;
        }   

        button:active {
            transform: scale(0.95);
        }

        #expression {
            margin: 20px 0;
            font-size: 24px;
            min-height: 40px;
            font-family: 'DotGothic16', sans-serif;
        }

        #result,
        #tips {
            margin-top: 20px;
            font-size: 20px;
            color: #28a745;
            font-family: 'DotGothic16', sans-serif;
            max-height: 150px;
            overflow-y: auto;
        }

        #result.error {
            color: #dc3545;
        }

        .hidden {
            display: none;
        }

        #feedbackButton {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #ffcc00;
            color: #333;
            border: 1px solid #ffae00;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            z-index: 9999;
        }
        #feedbackButton:hover {
         background-color: darkorange;
        }   


        #feedbackButton:active {
            transform: scale(0.95);
        }

             

        /* Modal styles */
        #welcomeModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3;
        }

        #welcomeContent {
            background-color: rgba(0, 0, 0, 0.9);
            color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            transition: opacity 2s ease-out;
        }

        #continueButton {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #ffcc00;
            color: #333;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            font-family: 'DotGothic16', sans-serif;
            font-size: 18px;
        }

        #continueButton:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>
 
    <div class="container2"></div>
    <div class="dark-overlay"></div>
    <div id="playButton" onclick="startGame()">PLAY</div>
    <div class="container">
       
        <h1>24 Game</h1>
        
        <div id="inputNumbers">
            <input type="number" id="number1" placeholder="01" min="1" >
            <input type="number" id="number2" placeholder="02" min="1" >
            <input type="number" id="number3" placeholder="03" min="1" >
            <input type="number" id="number4" placeholder="04" min="1" >
            <button onclick="initializeGame()">Submit</button>
           
        </div>
        <div id="numbers" class="hidden"></div>
        <div id="expression"></div>
        <button id="revealAnswerButton" class="hidden" onclick="revealAnswers()">Reveal Answer</button>
        <div id="result"></div>
        <div id="tips" class="hidden" onscroll="checkScroll()"></div>
        </div>
        <div id="numbers" class="hidden"></div>
        <div id="expression"></div>
        <button id="revealAnswerButton" class="hidden" onclick="revealAnswers()">Reveal Answer</button>
        <div id="result"></div>
        <div id="tips" class="hidden" onscroll="checkScroll()"></div>
    </div>

    <button id="feedbackButton" onclick="sendFeedback()">Send Feedback</button>
    <button id="GuideButton" class="hidden" onclick="goToGuide()">Guide</button>
   
    


    <script>
        let numbers = [];
        let expression = '';
        let currentSolutions = [];
        let symbolsRevealed = false;
    
        function closeModal() {
            const welcomeContent = document.getElementById('welcomeContent');
            welcomeContent.style.opacity = '0';
            setTimeout(() => {
                document.getElementById('welcomeModal').style.display = 'none';
            }, 2000);
        }
    
        function startGame() {
            const playButton = document.getElementById('playButton');
            const container = document.querySelector('.container');
            const overlay = document.querySelector('.dark-overlay');
    
            overlay.style.opacity = '1';
            playButton.style.opacity = '0';
            setTimeout(() => {
                playButton.style.display = 'none';
                container.style.display = 'block';
                setTimeout(() => {
                    container.style.opacity = '1';
                }, 50);
            }, 1000);
        }
    
        function initializeGame() {
            numbers = [
                parseInt(document.getElementById('number1').value),
                parseInt(document.getElementById('number2').value),
                parseInt(document.getElementById('number3').value),
                parseInt(document.getElementById('number4').value)
            ];
    
            expression = '';
            document.getElementById('expression').textContent = expression;
            document.getElementById('result').textContent = '';
    
            setTimeout(() => {
                document.getElementById('result').textContent = 'Showing possible answers...';
                generateTips();
                startRevealButtonTimer();
            }, 1000);
        }
    
        function startRevealButtonTimer() {
            const revealButton = document.getElementById('revealAnswerButton');
            revealButton.style.display = 'none';
            setTimeout(() => {
                revealButton.style.display = 'block';
            }, 5000);
        }
    
        function findSolutions(nums) {
            const solutions = [];
            const operators = ['+', '-', '*', '/'];
    
            function permute(arr) {
                if (arr.length === 1) return [arr];
                const result = [];
                for (let i = 0; i < arr.length; i++) {
                    const rest = permute(arr.slice(0, i).concat(arr.slice(i + 1)));
                    for (let r of rest) result.push([arr[i], ...r]);
                }
                return result;
            }
    
            function evaluateExpression(expression) {
                try {
                    return Math.abs(eval(expression) - 24) < 1e-10;
                } catch (e) {
                    return false;
                }
            }
    
            function generateOperatorCombinations() {
                const combinations = [];
                for (let op1 of operators) {
                    for (let op2 of operators) {
                        for (let op3 of operators) {
                            combinations.push([op1, op2, op3]);
                        }
                    }
                }
                return combinations;
            }
    
            const numberPermutations = permute(nums);
            const operatorCombinations = generateOperatorCombinations();
    
            for (let numbers of numberPermutations) {
                for (let ops of operatorCombinations) {
                    const [a, b, c, d] = numbers;
                    const [op1, op2, op3] = ops;
                    const expressions = [
                        `(${a} ${op1} ${b}) ${op2} (${c} ${op3} ${d})`,
                        `(${a} ${op1} (${b} ${op2} ${c})) ${op3} ${d}`,
                        `${a} ${op1} ((${b} ${op2} ${c}) ${op3} ${d})`,
                        `${a} ${op1} (${b} ${op2} (${c} ${op3} ${d}))`,
                        `((${a} ${op1} ${b}) ${op2} ${c}) ${op3} ${d}`
                    ];
    
                    for (let expr of expressions) {
                        if (evaluateExpression(expr)) {
                            solutions.push(expr);
                        }
                    }
                }
            }
    
            return [...new Set(solutions)];
        }
    
        function generateTips() {
            currentSolutions = findSolutions(numbers);
            const tipsElement = document.getElementById('tips');
            const resultElement = document.getElementById('result');
            const revealButton = document.getElementById('revealAnswerButton');
    
            if (currentSolutions.length > 0) {
                tipsElement.innerHTML = "Possible ways to reach 24:<br>" +
                    currentSolutions.map(tip => `<div>${tip.replace(/[+\-*/]/g, '_')}</div>`).join('');
                tipsElement.style.display = 'block';
                resultElement.textContent = '';
            } else {
                tipsElement.style.display = 'none';
                resultElement.textContent = 'No solution found.';
                revealButton.style.display = 'none';
            }
        }
    
        function revealAnswers() {
            const tipsElement = document.getElementById('tips');
            const revealButton = document.getElementById('revealAnswerButton');
    
            if (symbolsRevealed) {
                tipsElement.innerHTML = currentSolutions.map(tip => `<div>${tip.replace(/[+\-*/]/g, '_')}</div>`).join('');
                revealButton.textContent = 'Reveal Answer';
            } else {
                tipsElement.innerHTML = currentSolutions.map(tip => `<div>${tip}</div>`).join('');
                revealButton.textContent = 'Hide Answer';
            }
            symbolsRevealed = !symbolsRevealed;
        }
    </script>
    
    <script src="anime.min.js"></script>
    <script>
        const container = document.querySelector('.container2');
        for (let i = 0; i < 100; i++) {
            const block = document.createElement('div');
            block.classList.add('block');
            block.style.top = `${Math.random() * 100}vh`;
            block.style.left = `-${Math.random() * 50}px`;
            block.style.animationDelay = `${Math.random() * 5}s`;
            block.style.animationDuration = `${3 + Math.random() * 2}s`;
            container.appendChild(block);
        }
        function animateBlocks() {
            anime({
                targets: '.block',
                translateX: () => anime.random(1200, 1500),
                translateY: () => anime.random(-500, 500),
                scale: () => anime.random(1, 3),
                easing: 'linear',
                duration: 2500,
                delay: anime.stagger(10),
                complete: animateBlocks,
            });
        }
        animateBlocks();
    </script>
    
</body>

</html>
